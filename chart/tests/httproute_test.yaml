suite: Test HTTPRoute
templates:
- httproute.yaml
tests:
- it: should render HTTPRoute with default values
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
  asserts:
    - isKind:
        of: HTTPRoute
    - equal:
        path: apiVersion
        value: gateway.networking.k8s.io/v1
    - equal:
        path: spec.hostnames
        value:
          - host.example.com
    - equal:
        path: spec.parentRefs
        value:
          - name: rancher
            sectionName: http
    - equal:
        path: spec.rules[0].backendRefs
        value:
          - name: RELEASE-NAME-rancher
            port: 80
            weight: 1
- it: should work with service.disableHTTP
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      servicePort: 443
    service:
      disableHTTP: true
  asserts:
    - equal:
        path: spec.rules[0].backendRefs
        value:
          - name: RELEASE-NAME-rancher
            port: 443
            weight: 1
- it: can target servicePort 443 without disabling port 80
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      servicePort: 443
  asserts:
    - equal:
        path: spec.rules[0].backendRefs
        value:
          - name: RELEASE-NAME-rancher
            port: 443
            weight: 1
- it: should render annotations when provided
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      annotations:
        custom.annotation/key: value
  asserts:
    - equal:
        path: metadata.annotations
        value:
          custom.annotation/key: value
- it: should render custom parentRefs
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: my-gateway
          namespace: my-namespace
  asserts:
    - equal:
        path: spec.parentRefs
        value:
          - name: my-gateway
            namespace: my-namespace
- it: it should fail when disableHTTP is set and servicePort is not 443
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
    service:
      disableHTTP: true
  asserts:
    - failedTemplate:
        errorPattern: "'/httpRoute/servicePort': value must be 443"
- it: should fail when hostname is not set
  set:
    ingress:
      enabled: false
    httpRoute:
      enabled: true
  asserts:
    - failedTemplate:
        errorPattern: "httpRoute requires hostname to be set"
- it: should fail when parentRefs is not set
  set:
    hostname: host.example.com
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs: []
  asserts:
    - failedTemplate:
        errorPattern: "httpRoute requires parentRefs to be set"
